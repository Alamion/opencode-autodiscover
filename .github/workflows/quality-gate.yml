name: Quality gate

on:
  workflow_call:

jobs:
  gate:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
